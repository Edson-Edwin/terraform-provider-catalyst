# Fast main-branch CI; full compatibility/package checks run on demand and releases.
name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      full:
        description: Run all Terraform versions, native platforms and release packaging
        type: boolean
        default: false

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

# Cancel superseded branch/PR checks, but never interrupt a release's checks.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  TF_ACC: '0'
  CHECKPOINT_DISABLE: '1'

jobs:
  changes:
    name: Secret scan and required checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      runtime: ${{ steps.paths.outputs.runtime }}
      validation: ${{ steps.paths.outputs.validation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: paths
        name: Detect code and configuration changes
        env:
          FULL_CHECKS: ${{ inputs.full || false }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
          if os.environ['FULL_CHECKS'] == 'true' or not base or set(base) == {'0'}:
              runtime = validation = True
          else:
              revision = [f'{base}...{head}'] if os.environ['EVENT_NAME'] == 'pull_request' else [base, head]
              paths = subprocess.check_output(['git', 'diff', '--name-only', '-z', *revision]).decode().split('\0')
              paths = [path for path in paths if path]
              runtime = any(path.endswith('.go') or path in {'go.mod', 'go.sum', 'GNUmakefile'}
                            or path.startswith('.github/workflows/') for path in paths)
              def prose(path):
                  return path.endswith('.md') and ('/' not in path or path.endswith('/README.md')
                      or path.startswith(('docs/guides/', '.github/')))
              validation = any(not prose(path) for path in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'runtime={str(runtime).lower()}\nvalidation={str(validation).lower()}\n')
          print(f'Runtime tests: {runtime}; configuration/docs/example checks: {validation}')
          PY

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Formatting, generation and examples share one tool setup/build cache.
  build:
    name: Static checks, docs and examples
    needs: changes
    if: needs.changes.outputs.validation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.5'
          terraform_wrapper: false
      - run: make deps-check
      - run: go vet ./...
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: test -z "$(gofmt -l main.go internal tools/tools.go)"
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - run: terraform fmt -check -recursive examples/
      - run: make generate
      - name: git diff
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard docs examples)"
      - run: make verify
      - run: python3 scripts/try-provider.py check

  # Verify supported Terraform CLI versions using offline lifecycle tests
  test:
    name: 'Provider Verification: Terraform ${{ matrix.terraform }}'
    # Run alongside static checks rather than waiting for them.
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        terraform: ${{ fromJSON(inputs.full && '["1.13.*", "1.14.*", "1.15.*", "1.16.*"]' || '["1.16.*"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
          # Separate source-keyed race cache from the static-check cache.
          cache-dependency-path: |
            go.sum
            main.go
            internal/**/*.go
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: Offline race tests
        env:
          FULL_CHECKS: ${{ inputs.full || false }}
        run: |
          extra=()
          if [ "$FULL_CHECKS" = true ]; then extra=(-count=1); fi
          go test -race "${extra[@]}" -timeout=10m ./...
        timeout-minutes: 10
      - run: make verify
        if: inputs.full && matrix.terraform != '1.16.*'
      - run: python3 scripts/try-provider.py check
        if: inputs.full && matrix.terraform != '1.16.*'

  package:
    if: inputs.full
    name: Release package verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.5'
          terraform_wrapper: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          install-only: true
      - run: make release-check

  native:
    if: inputs.full
    name: Native lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      TF_ACC: '0'
      CHECKPOINT_DISABLE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.5'
          terraform_wrapper: false
      - run: go test -count=1 ./...
      - run: go build ./...
